<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#C8A96E;letter-spacing:3px;text-transform:uppercase}
      .title{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:27px;fill:#F5F0EB}
      .label{font-family:'Hanken Grotesk','Helvetica Neue',sans-serif;font-size:12px;fill:#F5F0EB;letter-spacing:1px}
      .mono{font-family:'JetBrains Mono','SF Mono',monospace;font-size:10.5px;fill:#A09890}
      .mono-gold{font-family:'JetBrains Mono','SF Mono',monospace;font-size:11px;fill:#C8A96E}
      .caption{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#635D57;letter-spacing:2px;text-transform:uppercase}
    </style>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.55"/><stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#181310" stop-opacity="1"/><stop offset="100%" stop-color="#0A0806" stop-opacity="1"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C8A96E"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8CA88C"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#ambient)"/>

  <text x="60" y="42" class="kicker">MESH STUDIO</text>
  <text x="60" y="72" class="title">Fleet topology: probe, boot, recover</text>

  <!-- central fleet node -->
  <g transform="translate(210,225)">
    <circle r="54" fill="url(#glow)" opacity="0.7"/>
    <circle r="36" fill="#141210" stroke="#C8A96E" stroke-width="2.4" filter="url(#softGlow)"/>
    <text y="4" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#C8A96E">FLEET</text>
    <text y="-66" text-anchor="middle" class="label">CENTRAL NODE</text>
  </g>

  <!-- probe branch -->
  <path d="M246,205 C340,150 420,150 500,150" fill="none" stroke="#C8A96E" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(560,150)">
    <circle r="34" fill="url(#glow)" opacity="0.4"/>
    <circle r="24" fill="#141210" stroke="#C8A96E" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#F5F0EB" stroke-width="1.4"/>
    <line x1="5" y1="5" x2="10" y2="10" stroke="#F5F0EB" stroke-width="1.4" stroke-linecap="round"/>
    <text y="-40" text-anchor="middle" class="label">PROBE</text>
    <text y="46" text-anchor="middle" class="mono">health check</text>
  </g>

  <!-- boot branch -->
  <path d="M246,225 H500" fill="none" stroke="#C8A96E" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(560,225)">
    <circle r="34" fill="url(#glow)" opacity="0.4"/>
    <circle r="24" fill="#141210" stroke="#C8A96E" stroke-width="2"/>
    <path d="M-6,7 L0,-7 L6,7 Z" fill="none" stroke="#F5F0EB" stroke-width="1.4" stroke-linejoin="round"/>
    <text y="-40" text-anchor="middle" class="label">BOOT</text>
    <text y="46" text-anchor="middle" class="mono">cold start</text>
  </g>

  <!-- recover branch -->
  <path d="M246,245 C340,300 420,300 500,300" fill="none" stroke="#8CA88C" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <g transform="translate(560,300)">
    <circle r="34" fill="#8CA88C" fill-opacity="0.15"/>
    <circle r="24" fill="#141210" stroke="#8CA88C" stroke-width="2"/>
    <path d="M-6,-2 A6,6 0 1 1 -6,3" fill="none" stroke="#8CA88C" stroke-width="1.4"/>
    <path d="M-6,-6 L-6,-2 L-2,-3" fill="none" stroke="#8CA88C" stroke-width="1.4" stroke-linejoin="round"/>
    <text y="-40" text-anchor="middle" class="label">RECOVER</text>
    <text y="46" text-anchor="middle" class="mono" fill="#8CA88C">auto-heal</text>
  </g>

  <!-- fanning out to node fleet at right -->
  <g font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#A09890">
    <path d="M594,150 C660,150 680,120 740,110" stroke="#A09890" stroke-width="1.4" opacity="0.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M594,150 C660,150 680,150 740,150" stroke="#A09890" stroke-width="1.4" opacity="0.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M594,225 C660,225 680,200 740,190" stroke="#A09890" stroke-width="1.4" opacity="0.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M594,225 C660,225 680,250 740,260" stroke="#A09890" stroke-width="1.4" opacity="0.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M594,300 C660,300 680,300 740,300" stroke="#8CA88C" stroke-width="1.4" opacity="0.6" fill="none" marker-end="url(#arrowGreen)"/>
    <path d="M594,300 C660,300 680,330 740,340" stroke="#8CA88C" stroke-width="1.4" opacity="0.6" fill="none" marker-end="url(#arrowGreen)"/>

    <rect x="760" y="98" width="90" height="26" rx="6" fill="#141210" stroke="#A09890" stroke-width="1.2"/>
    <text x="805" y="115" text-anchor="middle" fill="#F5F0EB">node-14</text>
    <rect x="760" y="138" width="90" height="26" rx="6" fill="#141210" stroke="#A09890" stroke-width="1.2"/>
    <text x="805" y="155" text-anchor="middle" fill="#F5F0EB">node-27</text>
    <rect x="760" y="178" width="90" height="26" rx="6" fill="#141210" stroke="#A09890" stroke-width="1.2"/>
    <text x="805" y="195" text-anchor="middle" fill="#F5F0EB">node-31</text>
    <rect x="760" y="248" width="90" height="26" rx="6" fill="#141210" stroke="#A09890" stroke-width="1.2"/>
    <text x="805" y="265" text-anchor="middle" fill="#F5F0EB">node-08</text>
    <rect x="760" y="288" width="90" height="26" rx="6" fill="#8CA88C" fill-opacity="0.1" stroke="#8CA88C" stroke-width="1.4"/>
    <text x="805" y="305" text-anchor="middle" fill="#8CA88C">node-02 ✓</text>
    <rect x="760" y="328" width="90" height="26" rx="6" fill="#8CA88C" fill-opacity="0.1" stroke="#8CA88C" stroke-width="1.4"/>
    <text x="805" y="345" text-anchor="middle" fill="#8CA88C">node-19 ✓</text>
  </g>

  <line x1="60" y1="372" x2="1140" y2="372" stroke="#A09890" stroke-width="1" opacity="0.12"/>
  <text x="60" y="392" class="caption">probe finds it, boot brings it up, recover keeps it there</text>
</svg>
